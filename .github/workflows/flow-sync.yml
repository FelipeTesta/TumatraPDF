name: FLOW map sync

on:
  push:
    branches: ["main", "master"]
    paths:
      - "FLOW/**"
      - "sumatrapdf-src/src/**"
      - "sumatrapdf-src/cmd/gen-*.ts"
      - "scripts/flow-sync.ts"
  pull_request:
    paths:
      - "FLOW/**"
      - "sumatrapdf-src/src/**"
      - "sumatrapdf-src/cmd/gen-*.ts"
      - "scripts/flow-sync.ts"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Check FLOW/*.dot references
        run: bun scripts/flow-sync.ts
